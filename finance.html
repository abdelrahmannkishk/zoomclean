        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; overflow-x: hidden; overscroll-behavior-y: none; }
        .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); }
        .card-shadow { box-shadow: 0 4px 24px -4px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); }
        .hover-lift { transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s; }

        .neon-glow-green { box-shadow: 0 0 20px rgba(74,222,128,0.3); }
        .neon-glow-red { box-shadow: 0 0 20px rgba(239,68,68,0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .input-no-zoom { font-size: 16px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .nav-active { color: #2563eb !important; }

        .syncing { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .safe-top { padding-top: env(safe-area-inset-top, 0); }
        .btn-touch { min-height: 44px; min-width: 44px; cursor: pointer; -webkit-user-select: none; user-select: none; }
        .btn-touch:active { transform: scale(0.95); opacity: 0.9; }

</head>

        <!-- Quick Stats -->

                </div>
                <p id="salesCount" class="text-xl font-black text-slate-800">0</p>

            <div class="glass rounded-[1.5rem] p-4 card-shadow btn-touch">

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-[70] bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm flex items-center gap-2 animate-fade-in">

    <!-- PWA Scripts -->
    <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                if (!localStorage.getItem('pwa_dismissed')) {
                    document.getElementById('installBanner').classList.remove('hidden');
                }
            }, 3000);
        });
        document.getElementById('btnInstall').addEventListener('click', function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') showToast('تم تثبيت التطبيق!');
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.add('hidden');
                });
            } else {
                showToast('اضغط على زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"', 'info');
            }
        });
        document.getElementById('btnDismissInstall').addEventListener('click', function() {
            localStorage.setItem('pwa_dismissed', 'true');
            document.getElementById('installBanner').classList.add('hidden');
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW failed:', err));
            });
        }
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = this.getAttribute('href');
            });
        });
    </script>

    <!-- Firebase SDK v10.7.1 Module -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, set, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCArpnKK4qsM8B3ds5iW-JAYb_DWml_xUk",
            authDomain: "zoomclean-144b6.firebaseapp.com",
            databaseURL: "https://zoomclean-144b6-default-rtdb.firebaseio.com",
            projectId: "zoomclean-144b6",
            storageBucket: "zoomclean-144b6.firebasestorage.app",
            messagingSenderId: "521673315417",
            appId: "1:521673315417:web:90ec0cc4eb19295b048d48",
            measurementId: "G-HG01XQTFEV"
        };

        let app, db;
        let firebaseConnected = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            console.log('Firebase initialized successfully');
        } catch (err) {
            console.error('Firebase init error:', err);
            showToast('خطأ في الاتصال بـ Firebase', 'error');
        }

        // ==================== DATA STORE ====================
        let store = { products: [], cart: [], expenses: [], needs: [], debtors: [], dailySales: 0, dailyExpenses: 0 };

        function loadLocalStore() {
            const saved = localStorage.getItem('zoomclean_store');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.expenses) data.expenses.forEach(e => { if (e.date) e.date = new Date(e.date); });
                    if (data.debtors) data.debtors.forEach(d => { 
                        if (d.history) d.history.forEach(h => { if (h.date) h.date = new Date(h.date); }); 
                    });
                    return data;
                } catch (e) { console.error('LocalStorage parse error:', e); }
            }
            return {
                products: [
                    { id: 1, name: "كلوركس 1 لتر", barcode: "1234567890123", price: 25, stock: 45 },
                    { id: 2, name: "صابون لوكس 125g", barcode: "1234567890124", price: 12, stock: 120 },
                    { id: 3, name: "منظف زجاج 500ml", barcode: "1234567890125", price: 18, stock: 30 },
                    { id: 4, name: "معطر جو", barcode: "1234567890126", price: 35, stock: 22 },
                    { id: 5, name: "مسحوق غسيل 2kg", barcode: "1234567890127", price: 85, stock: 15 },
                    { id: 6, name: "سائل جلي 1 لتر", barcode: "1234567890128", price: 22, stock: 50 },
                    { id: 7, name: "ورق تواليت", barcode: "1234567890129", price: 45, stock: 60 },
                    { id: 8, name: "منظف أرضيات", barcode: "1234567890130", price: 28, stock: 40 },
                ],
                cart: [], expenses: [], needs: [], debtors: [], dailySales: 0, dailyExpenses: 0,
            };
        }

        function saveLocalStore() { 
            try {
                localStorage.setItem('zoomclean_store', JSON.stringify(store)); 
            } catch (e) { console.error('LocalStorage save error:', e); }
        }

        // ==================== FIREBASE SYNC ====================
        function syncToFirebase() {
            if (!db || !firebaseConnected) {
                console.log('Firebase not connected, saving locally only');
                saveLocalStore();
                return;
            }
            const data = {
                products: store.products,
                expenses: store.expenses,
                needs: store.needs,
                debtors: store.debtors,
                dailySales: store.dailySales,
                dailyExpenses: store.dailyExpenses,
                lastUpdated: new Date().toISOString()
            };
            set(ref(db, 'zoomclean'), data)
                .then(() => { console.log('Synced to Firebase'); showSyncStatus(); })
                .catch(err => { 
                    console.error('Sync error:', err); 
                    saveLocalStore();
                    showOfflineStatus();
                });
        }

        function showSyncStatus() {
            const status = document.getElementById('syncStatus');
            const offline = document.getElementById('offlineStatus');
            if (status) {
                status.classList.remove('hidden');
                status.classList.add('syncing');
                setTimeout(() => status.classList.remove('syncing'), 2000);
            }
            if (offline) offline.classList.add('hidden');
            firebaseConnected = true;
        }

        function showOfflineStatus() {
            const status = document.getElementById('syncStatus');
            const offline = document.getElementById('offlineStatus');
            if (status) status.classList.add('hidden');
            if (offline) offline.classList.remove('hidden');
            firebaseConnected = false;
        }

        function initFirebaseListeners() {
            if (!db) {
                console.log('No Firebase DB, using local only');
                store = loadLocalStore();
                updateTelemetry();
                renderExpenses();
                showOfflineStatus();
                return;
            }

            // Test connection
            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    console.log('Firebase connected');
                    showSyncStatus();
                } else {
                    console.log('Firebase disconnected');
                    showOfflineStatus();
                }
            });

            onValue(ref(db, 'zoomclean/dailySales'), (snapshot) => {
                if (snapshot.exists()) { store.dailySales = snapshot.val(); updateTelemetry(); showSyncStatus(); }
            }, (error) => { console.error('dailySales error:', error); });

            onValue(ref(db, 'zoomclean/dailyExpenses'), (snapshot) => {
                if (snapshot.exists()) { store.dailyExpenses = snapshot.val(); updateTelemetry(); showSyncStatus(); }
            }, (error) => { console.error('dailyExpenses error:', error); });

            onValue(ref(db, 'zoomclean/expenses'), (snapshot) => {
                if (snapshot.exists()) {
                    store.expenses = snapshot.val();
                    store.expenses.forEach(e => { if (e.date) e.date = new Date(e.date); });
                    renderExpenses(); showSyncStatus();
                }
            }, (error) => { console.error('expenses error:', error); });

            get(ref(db, 'zoomclean')).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    store.dailySales = data.dailySales || 0;
                    store.dailyExpenses = data.dailyExpenses || 0;
                    store.expenses = data.expenses || [];
                    store.products = data.products || store.products;
                    store.debtors = data.debtors || [];
                    store.needs = data.needs || [];
                    store.expenses.forEach(e => { if (e.date) e.date = new Date(e.date); });
                    store.debtors.forEach(d => { if (d.history) d.history.forEach(h => { if (h.date) h.date = new Date(h.date); }); });
                    updateTelemetry(); renderExpenses(); showSyncStatus();
                } else {
                    store = loadLocalStore();
                    syncToFirebase();
                    updateTelemetry(); renderExpenses();
                }
            }).catch((err) => {
                console.error('Firebase get error:', err);
                store = loadLocalStore();
                updateTelemetry(); renderExpenses();
                showOfflineStatus();
                showToast('وضع عدم الاتصال - البيانات محلية', 'info');
            });
        }

        // ==================== TELEMETRY ====================
        function updateTelemetry() {
            const dailySalesEl = document.getElementById('dailySales');
            const dailyExpensesEl = document.getElementById('dailyExpenses');
            const netCashEl = document.getElementById('netCash');
            const salesCountEl = document.getElementById('salesCount');
            const expensesCount2El = document.getElementById('expensesCount2');

            if (dailySalesEl) dailySalesEl.textContent = store.dailySales.toLocaleString();
            if (dailyExpensesEl) dailyExpensesEl.textContent = store.dailyExpenses.toLocaleString();
            if (netCashEl) netCashEl.textContent = (store.dailySales - store.dailyExpenses).toLocaleString();
            if (salesCountEl) salesCountEl.textContent = store.dailySales > 0 ? '✓' : '0';
            if (expensesCount2El) expensesCount2El.textContent = store.expenses.length;
        }

        // ==================== EXPENSES ====================
        function addExpense() {
            const descEl = document.getElementById('expenseDesc');
            const amountEl = document.getElementById('expenseAmount');
            const desc = descEl.value.trim();
            const amount = parseFloat(amountEl.value);
            if (!desc || !amount || amount <= 0) { showToast('أدخل وصف ومبلغ صحيح!', 'error'); return; }
            store.expenses.push({ desc, amount, date: new Date() });
            store.dailyExpenses += amount;
            descEl.value = '';
            amountEl.value = '';
            updateTelemetry(); renderExpenses(); saveLocalStore(); syncToFirebase();
            showToast(`تم تسجيل مصروف: ${amount} ج.م`);
        }

        function renderExpenses() {
            const container = document.getElementById('expensesList');
            const count = document.getElementById('expensesCount');
            if (count) count.textContent = store.expenses.length;
            if (store.expenses.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fas fa-receipt text-3xl mb-2 opacity-50"></i><p class="text-sm">لا توجد مصروفات مسجلة</p></div>`;
                return;
            }
            container.innerHTML = [...store.expenses].reverse().map(e => `
                <div class="flex items-center justify-between p-3 bg-white rounded-xl card-shadow border border-slate-100 animate-fade-in">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${e.desc}</p>
                        <p class="text-[10px] text-slate-400">${new Date(e.date).toLocaleString('ar-EG')}</p>
                    </div>
                    <div class="text-left">
                        <p class="font-bold text-red-500 text-lg">-${e.amount}</p>
                        <p class="text-[10px] text-slate-400">ج.م</p>
                    </div>
                </div>
            `).join('');
        }

        // ==================== RESET DAY ====================
        function resetDay() {
            if (!confirm('هل أنت متأكد من بدء يوم جديد؟ سيتم تصفير المبيعات والمصروفات.')) return;
            store.dailySales = 0;
            store.dailyExpenses = 0;
            store.expenses = [];
            updateTelemetry();
            renderExpenses();
            saveLocalStore();
            syncToFirebase();
            showToast('تم بدء يوم جديد!');
        }

        // ==================== UTILITIES ====================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            if (!toast || !icon || !msg) return;
            msg.textContent = message;
            if (type === 'error') icon.className = 'fas fa-exclamation-circle text-red-400';
            else if (type === 'info') icon.className = 'fas fa-info-circle text-blue-400';
            else icon.className = 'fas fa-check-circle text-green-400';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Button event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Load local first for instant display
            store = loadLocalStore();
            updateTelemetry();
            renderExpenses();

            // Then try Firebase
            initFirebaseListeners();

            document.getElementById('btnAddExpense').addEventListener('click', addExpense);
            document.getElementById('btnResetDay').addEventListener('click', resetDay);
            document.getElementById('expenseAmount').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addExpense();
            });
        });
    </script>
</body>
</html>
