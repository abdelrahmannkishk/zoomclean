        .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); }
        .card-shadow { box-shadow: 0 4px 24px -4px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); }
        .hover-lift { transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @media (min-width: 1024px) { .desktop-layout { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; max-width: 1200px; margin: 0 auto; } }
        .safe-top { padding-top: env(safe-area-inset-top, 0); }
        .btn-touch { min-height: 44px; min-width: 44px; cursor: pointer; -webkit-user-select: none; user-select: none; }
        .btn-touch:active { transform: scale(0.95); opacity: 0.9; }

    <!-- PWA Install Scripts -->
    <script>
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                if (!localStorage.getItem('pwa_dismissed')) {
                    document.getElementById('installBanner').classList.remove('hidden');
                }
            }, 3000);
        });

        document.getElementById('btnInstall').addEventListener('click', function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') showToast('تم تثبيت التطبيق!');
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.add('hidden');
                });
            } else {
                showToast('اضغط على زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"', 'info');
            }
        });

        document.getElementById('btnDismissInstall').addEventListener('click', function() {
            localStorage.setItem('pwa_dismissed', 'true');
            document.getElementById('installBanner').classList.add('hidden');
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW failed:', err));
            });
        }

        // Navigation
        document.querySelectorAll('[data-nav]').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = this.getAttribute('href');
            });
        });
    </script>

    <!-- Firebase SDK v10.7.1 Module -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, set, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCArpnKK4qsM8B3ds5iW-JAYb_DWml_xUk",
            authDomain: "zoomclean-144b6.firebaseapp.com",
            databaseURL: "https://zoomclean-144b6-default-rtdb.firebaseio.com",
            projectId: "zoomclean-144b6",
            storageBucket: "zoomclean-144b6.firebasestorage.app",
            messagingSenderId: "521673315417",
            appId: "1:521673315417:web:90ec0cc4eb19295b048d48",
            measurementId: "G-HG01XQTFEV"
        };

        let app, db;
        let firebaseConnected = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            console.log('Firebase initialized successfully');
        } catch (err) {
            console.error('Firebase init error:', err);
            showToast('خطأ في الاتصال بـ Firebase', 'error');
        }

        // ==================== DATA STORE ====================
        let store = {
            products: [],
            cart: [],
            expenses: [],
            needs: [],
            debtors: [],
            dailySales: 0,
            dailyExpenses: 0,
        };

        function loadLocalStore() {
            const saved = localStorage.getItem('zoomclean_store');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.expenses) data.expenses.forEach(e => { if (e.date) e.date = new Date(e.date); });
                    if (data.debtors) data.debtors.forEach(d => { 
                        if (d.history) d.history.forEach(h => { if (h.date) h.date = new Date(h.date); }); 
                    });
                    return data;
                } catch (e) { console.error('LocalStorage parse error:', e); }
            }
            return {
                products: [
                    { id: 1, name: "كلوركس 1 لتر", barcode: "1234567890123", price: 25, stock: 45 },
                    { id: 2, name: "صابون لوكس 125g", barcode: "1234567890124", price: 12, stock: 120 },
                    { id: 3, name: "منظف زجاج 500ml", barcode: "1234567890125", price: 18, stock: 30 },
                    { id: 4, name: "معطر جو", barcode: "1234567890126", price: 35, stock: 22 },
                    { id: 5, name: "مسحوق غسيل 2kg", barcode: "1234567890127", price: 85, stock: 15 },
                    { id: 6, name: "سائل جلي 1 لتر", barcode: "1234567890128", price: 22, stock: 50 },
                    { id: 7, name: "ورق تواليت", barcode: "1234567890129", price: 45, stock: 60 },
                    { id: 8, name: "منظف أرضيات", barcode: "1234567890130", price: 28, stock: 40 },
                ],
                cart: [], expenses: [], needs: [], debtors: [], dailySales: 0, dailyExpenses: 0,
            };
        }

        function saveLocalStore() { 
            try {
                localStorage.setItem('zoomclean_store', JSON.stringify(store)); 
            } catch (e) { console.error('LocalStorage save error:', e); }
        }

        // ==================== FIREBASE SYNC ====================
        function syncToFirebase() {
            if (!db || !firebaseConnected) {
                console.log('Firebase not connected, saving locally only');
                saveLocalStore();
                return;
            }
            const data = {
                products: store.products,
                expenses: store.expenses,
                needs: store.needs,
                debtors: store.debtors,
                dailySales: store.dailySales,
                dailyExpenses: store.dailyExpenses,
                lastUpdated: new Date().toISOString()
            };
            set(ref(db, 'zoomclean'), data)
                .then(() => { console.log('Synced to Firebase'); showSyncStatus(); })
                .catch(err => { 
                    console.error('Sync error:', err); 
                    saveLocalStore();
                    showOfflineStatus();
                });
        }

        function showSyncStatus() {
            const status = document.getElementById('syncStatus');
            const offline = document.getElementById('offlineStatus');
            if (status) {
                status.classList.remove('hidden');
                status.classList.add('syncing');
                setTimeout(() => status.classList.remove('syncing'), 2000);
            }
            if (offline) offline.classList.add('hidden');
            firebaseConnected = true;
        }

        function showOfflineStatus() {
            const status = document.getElementById('syncStatus');
            const offline = document.getElementById('offlineStatus');
            if (status) status.classList.add('hidden');
            if (offline) offline.classList.remove('hidden');
            firebaseConnected = false;
        }

        function initFirebaseListeners() {
            if (!db) {
                console.log('No Firebase DB, using local only');
                store = loadLocalStore();
                renderProducts();
                renderCart();
                showOfflineStatus();
                return;
            }

            // Test connection first
            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    console.log('Firebase connected');
                    showSyncStatus();
                } else {
                    console.log('Firebase disconnected');
                    showOfflineStatus();
                }
            });

            // Products listener
            onValue(ref(db, 'zoomclean/products'), (snapshot) => {
                if (snapshot.exists()) {
                    store.products = snapshot.val();
                    renderProducts();
                    showSyncStatus();
                }
            }, (error) => {
                console.error('Products listener error:', error);
                showOfflineStatus();
            });

            // Daily stats listener
            onValue(ref(db, 'zoomclean/dailySales'), (snapshot) => {
                if (snapshot.exists()) store.dailySales = snapshot.val();
            }, (error) => { console.error('dailySales error:', error); });

            onValue(ref(db, 'zoomclean/dailyExpenses'), (snapshot) => {
                if (snapshot.exists()) store.dailyExpenses = snapshot.val();
            }, (error) => { console.error('dailyExpenses error:', error); });

            // Initial load
            get(ref(db, 'zoomclean')).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    store.products = data.products || store.products;
                    store.expenses = data.expenses || [];
                    store.needs = data.needs || [];
                    store.debtors = data.debtors || [];
                    store.dailySales = data.dailySales || 0;
                    store.dailyExpenses = data.dailyExpenses || 0;
                    if (store.expenses) store.expenses.forEach(e => { if (e.date) e.date = new Date(e.date); });
                    if (store.debtors) store.debtors.forEach(d => { 
                        if (d.history) d.history.forEach(h => { if (h.date) h.date = new Date(h.date); }); 
                    });
                    renderProducts();
                    renderCart();
                    showSyncStatus();
                    saveLocalStore();
                } else {
                    store = loadLocalStore();
                    syncToFirebase();
                    renderProducts();
                    renderCart();
                }
            }).catch((err) => {
                console.error('Firebase get error:', err);
                store = loadLocalStore();
                renderProducts();
                renderCart();
                showOfflineStatus();
                showToast('وضع عدم الاتصال - البيانات محلية', 'info');
            });
        }

        // ==================== CLOCK ====================
        function updateClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ==================== SEARCH ====================
        function handleSearch(e) {
            const query = e.target.value.trim().toLowerCase();
            const suggestions = document.getElementById('searchSuggestions');
            if (query.length < 1) { suggestions.classList.add('hidden'); renderProducts(); return; }
            const matches = store.products.filter(p => p.name.toLowerCase().includes(query) || p.barcode.includes(query));
            if (matches.length === 0) {
                suggestions.innerHTML = `<div class="p-4 text-center text-slate-400"><p class="text-sm">لا توجد نتائج</p></div>`;
            } else {
                suggestions.innerHTML = matches.map(p => `
                    <div data-product-id="${p.id}" class="suggestion-item flex items-center justify-between p-3 hover:bg-blue-50 cursor-pointer transition border-b border-slate-100 last:border-0">
                        <div><p class="font-bold text-slate-800 text-sm">${p.name}</p><p class="text-xs text-slate-400 font-mono">${p.barcode}</p></div>
                        <div class="text-left"><p class="font-bold text-blue-600">${p.price} ج.م</p><p class="text-[10px] text-slate-400">مخزون: ${p.stock}</p></div>
                    </div>
                `).join('');
                document.querySelectorAll('.suggestion-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const pid = parseInt(this.getAttribute('data-product-id'));
                        addToCart(pid);
                        document.getElementById('searchInput').value = '';
                        suggestions.classList.add('hidden');
                        const p = store.products.find(x => x.id === pid);
                        showToast(p ? `تمت إضافة: ${p.name}` : 'تمت الإضافة');
                    });
                });
            }
            suggestions.classList.remove('hidden');
            renderProducts(matches);
        }

        // ==================== PRODUCTS ====================
        function renderProducts(productsToShow = null) {
            const grid = document.getElementById('productsGrid');
            const products = productsToShow || store.products;
            const count = document.getElementById('productsCount');
            if (count) count.textContent = products.length;
            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400"><i class="fas fa-box-open text-3xl mb-2 opacity-50"></i><p class="text-sm">لا توجد منتجات</p></div>`;
                return;
            }
            grid.innerHTML = products.map(p => {
                const stockColor = p.stock <= 10 ? 'text-red-500 bg-red-50' : p.stock <= 25 ? 'text-orange-500 bg-orange-50' : 'text-green-600 bg-green-50';
                return `
                    <div data-product-id="${p.id}" class="product-card bg-white rounded-2xl p-4 card-shadow hover-lift cursor-pointer border border-slate-100 hover:border-blue-200 transition group animate-fade-in btn-touch">
                        <div class="flex items-start justify-between mb-2">
                            <span class="${stockColor} px-2 py-0.5 rounded-lg text-[10px] font-bold">${p.stock}</span>
                            <i class="fas fa-plus-circle text-blue-400 opacity-0 group-hover:opacity-100 transition text-lg"></i>
                        </div>
                        <p class="font-bold text-slate-800 text-sm mb-1 truncate">${p.name}</p>
                        <p class="text-xs text-slate-400 font-mono mb-2">${p.barcode}</p>
                        <p class="font-black text-blue-600 text-lg">${p.price} <span class="text-xs font-normal text-slate-400">ج.م</span></p>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', function() {
                    const pid = parseInt(this.getAttribute('data-product-id'));
                    addToCart(pid);
                });
            });
        }

        // ==================== CART ====================
        function addToCart(productId) {
            const product = store.products.find(p => p.id === productId);
            if (!product || product.stock <= 0) { showToast('المنتج غير متوفر!', 'error'); return; }
            const existing = store.cart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty < product.stock) existing.qty++;
                else { showToast('الكمية غير متوفرة!', 'error'); return; }
            } else { store.cart.push({ ...product, qty: 1 }); }
            renderCart();
        }

        function removeFromCart(productId) {
            store.cart = store.cart.filter(item => item.id !== productId);
            renderCart();
        }

        function updateCartQty(productId, delta) {
            const item = store.cart.find(i => i.id === productId);
            const product = store.products.find(p => p.id === productId);
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty <= 0) { removeFromCart(productId); return; }
            if (newQty > product.stock) { showToast('الكمية غير متوفرة!', 'error'); return; }
            item.qty = newQty; renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const count = document.getElementById('cartCount');
            const subtotal = document.getElementById('subtotal');
            const total = document.getElementById('cartTotal');
            if (count) count.textContent = store.cart.reduce((sum, item) => sum + item.qty, 0);
            if (store.cart.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fas fa-cart-plus text-3xl mb-2 opacity-50"></i><p class="text-sm">السلة فارغة</p></div>`;
                if (subtotal) subtotal.textContent = '0.00 ج.م'; 
                if (total) total.textContent = '0.00 ج.م'; 
                return;
            }
            let sum = 0;
            container.innerHTML = store.cart.map(item => {
                sum += item.price * item.qty;
                return `
                    <div class="flex items-center gap-3 bg-slate-50 rounded-xl p-3 animate-fade-in">
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-800 text-sm truncate">${item.name}</p>
                            <p class="text-xs text-slate-400">${item.price} ج.م × ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button data-action="dec" data-pid="${item.id}" class="cart-btn w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-100 transition btn-touch"><i class="fas fa-minus text-xs"></i></button>
                            <span class="font-bold text-slate-800 w-6 text-center text-sm">${item.qty}</span>
                            <button data-action="inc" data-pid="${item.id}" class="cart-btn w-8 h-8 rounded-lg bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-600 hover:bg-blue-200 transition btn-touch"><i class="fas fa-plus text-xs"></i></button>
                        </div>
                        <button data-action="del" data-pid="${item.id}" class="cart-btn w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center text-red-500 hover:bg-red-100 transition btn-touch"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.cart-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.getAttribute('data-action');
                    const pid = parseInt(this.getAttribute('data-pid'));
                    if (action === 'inc') updateCartQty(pid, 1);
                    else if (action === 'dec') updateCartQty(pid, -1);
                    else if (action === 'del') removeFromCart(pid);
                });
            });

            if (subtotal) subtotal.textContent = sum.toFixed(2) + ' ج.م'; 
            if (total) total.textContent = sum.toFixed(2) + ' ج.م';
        }

        function checkout() {
            if (store.cart.length === 0) { showToast('السلة فارغة!', 'error'); return; }
            let total = 0;
            store.cart.forEach(item => {
                total += item.price * item.qty;
                const product = store.products.find(p => p.id === item.id);
                if (product) product.stock -= item.qty;
            });
            store.dailySales += total; store.cart = [];
            renderCart(); renderProducts();
            saveLocalStore(); syncToFirebase();
            showToast(`تم البيع! ${total.toFixed(2)} ج.م`);
            setTimeout(() => {
                const si = document.getElementById('searchInput');
                if (si) si.focus();
            }, 100);
        }

        function quickAddCopy() {
            store.dailySales += 1; saveLocalStore(); syncToFirebase();
            showToast('تم تسجيل نسخة سريعة (1 ج.م)');
        }

        function syncKyocera() {
            showToast('جاري المزامنة مع Kyocera 4501i...', 'info');
            setTimeout(() => showToast('تمت المزامنة!'), 1500);
        }

        // ==================== UTILITIES ====================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            if (!toast || !icon || !msg) return;
            msg.textContent = message;
            if (type === 'error') icon.className = 'fas fa-exclamation-circle text-red-400';
            else if (type === 'info') icon.className = 'fas fa-info-circle text-blue-400';
            else icon.className = 'fas fa-check-circle text-green-400';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            updateClock(); setInterval(updateClock, 1000);

            // Load local first for instant display
            store = loadLocalStore();
            renderProducts();
            renderCart();

            // Then try Firebase
            initFirebaseListeners();

            // Search input
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const val = e.target.value.trim();
                        const product = store.products.find(p => p.barcode === val);
                        if (product) {
                            addToCart(product.id);
                            e.target.value = '';
                            document.getElementById('searchSuggestions').classList.add('hidden');
                            showToast(`تمت إضافة: ${product.name}`);
                        }
                    }
                });
                setTimeout(() => searchInput.focus(), 500);
            }

            // Button listeners
            document.getElementById('btnQuickCopy').addEventListener('click', quickAddCopy);
            document.getElementById('btnKyocera').addEventListener('click', syncKyocera);
            document.getElementById('btnKyoceraMobile').addEventListener('click', syncKyocera);
            document.getElementById('btnCheckout').addEventListener('click', checkout);
        });

        // Close suggestions on outside click
        document.addEventListener('click', (e) => {
            const searchWrap = document.querySelector('.relative');
            if (searchWrap && !searchWrap.contains(e.target)) {
                const suggestions = document.getElementById('searchSuggestions');
                if (suggestions) suggestions.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
